name: build

# Every push to main and every pull request builds and tests the Windows
# installer. Pushing a tag like v0.4.2 also publishes it as a GitHub Release;
# a tag with a suffix (v0.4.2-rc.1) publishes a pre-release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            "$version"|"$version"-*) echo "Tag $GITHUB_REF_NAME builds version $version" ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --lib
        working-directory: src-tauri
      - run: npx tauri build
      - name: Checksums
        shell: bash
        working-directory: src-tauri/target/release/bundle/nsis
        run: sha256sum *.exe | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pontoon-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: windows
    # Publishes on version tags. On pull requests it is a dry run: it prepares
    # the same release notes and files but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pontoon-windows-installer
          path: dist
      - name: Write the release notes
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          installer="Pontoon_${version}_x64-setup.exe"
          test -f "dist/$installer" || { echo "::error::dist/$installer is missing"; ls dist; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS.txt)
          {
            echo "Pontoon $version，Raft（app.raft.build）的非官方 Windows 客户端。"
            echo
            echo "下载 \`$installer\` 运行即可，安装到当前用户目录，不需要管理员权限。安装包没有代码签名，第一次运行时 SmartScreen 可能会拦截，点“更多信息 → 仍要运行”即可。已经装了旧版本的话，直接运行新安装包覆盖，登录状态和设置都会保留。"
            echo
            echo "SHA256："
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Pontoon ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes $prerelease
      - name: Dry run (nothing is published)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          echo "Would publish Pontoon $VERSION with:"
          ls -l dist
